services:
  app:
    build: .
    container_name: majordomo-app
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/majordomo
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-majordomo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-majordomo}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Secrets. Absent, the app still starts: OAuth falls back to form login
      # and Envoy/Librarian LLM calls fail at the point of use rather than at
      # boot. Set them in .env for anything beyond a smoke test.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Segue runs on the host, not in this compose file, and it binds to
      # loopback (its ADR-28). Inside a container 127.0.0.1 is the container
      # itself, so the default would silently never reach it.
      LIBRARIAN_SEGUE_ENDPOINT: ${LIBRARIAN_SEGUE_ENDPOINT:-http://host.docker.internal:8080/mcp}
      # Attachments are the only durable state the app writes outside Postgres.
      # Stated absolutely because the default (./data/attachments) resolves
      # against the image's WORKDIR — the container's writable layer, which
      # `up -d --build` replaces, taking every manual and receipt with it (#338).
      MAJORDOMO_STORAGE_BASE_DIR: /var/lib/majordomo/attachments
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - majordomo-attachments:/var/lib/majordomo/attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: majordomo-db
    environment:
      POSTGRES_DB: majordomo
      POSTGRES_USER: ${POSTGRES_USER:-majordomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-majordomo}
    ports:
      - "3946:5432"
    volumes:
      - majordomo-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majordomo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: majordomo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backup sidecar (ADR-0025). Shares postgres:18 with db so pg_dump and the
  # server upgrade together — pg_dump refuses to dump a server newer than
  # itself.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    container_name: majordomo-backup
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-majordomo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-majordomo}
      PGDATABASE: majordomo
      ATTACHMENTS_DIR: /var/lib/majordomo/attachments
      BACKUP_DIR: /backups
      # Public key: encrypts. Safe in .env, safe in a log.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # Private key: decrypts, and so is what restore and verification need. It
      # lives on this host, which adds no exposure the host does not already
      # have — the plaintext data is here too. What it must ALSO do is live
      # somewhere else, or a fire leaves only ciphertext. See doc/backup.md.
      BACKUP_AGE_IDENTITY: /config/identity.age
      BACKUP_REMOTES: ${BACKUP_REMOTES:-}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_VERIFY_EVERY: ${BACKUP_VERIFY_EVERY:-7}
      RCLONE_CONFIG: /config/rclone.conf
    volumes:
      # Read-write, not :ro. The backup only reads, but a restore has to put the
      # files back, and a restore you cannot run is the failure this whole
      # service exists to prevent.
      - majordomo-attachments:/var/lib/majordomo/attachments
      - majordomo-backups:/backups
      - ./config/backup:/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: majordomo-prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: majordomo-grafana
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      prometheus:
        condition: service_started

volumes:
  majordomo-data:
  majordomo-attachments:
  majordomo-backups:
  prometheus-data:
  grafana-data:
